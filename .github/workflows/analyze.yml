name: Analyze pending

# Analysis stage: Claude Code reads CLAUDE.md and processes pending videos from
# data/_pending/, committing after EACH video so nothing is lost if a run is interrupted.
#   • Normal mode   — every 3h, analyze_batch_size (50) videos per run, oldest first.
#   • Catch-up mode — when a big batch of videos lands at once (see src/fetch.py + the
#     catch_up block in config.json), the run switches to a large batch (process all
#     remaining), NEWEST-published first, and the */30 "sprint" cron drains the backlog
#     back-to-back until it clears, then auto-returns to normal. All free (public-repo
#     Actions + your Pro/Max subscription token) — no extra setup, no extra tokens.
on:
  schedule:
    - cron: "0 */3 * * *"     # normal cadence
    - cron: "*/30 * * * *"    # catch-up sprint cadence (no-ops unless catch-up is active)
  workflow_dispatch:

# Never run two analyses at once; queue instead of overlapping. GitHub keeps at most one
# run pending behind the running one, so the sprint cron can't pile up.
concurrency:
  group: skills-tracker-analyze
  cancel-in-progress: false

permissions:
  contents: write   # commit data/ + skills/ back to the repo
  id-token: write   # OIDC token required by claude-code-action

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay under GitHub's 6h job cap with margin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so per-video pushes rebase cleanly
          persist-credentials: true

      # Decide whether there is work, and (in catch-up mode) how big a batch + what order.
      # The */30 sprint cron only does work while catch-up is active; otherwise it no-ops
      # cheaply (a few seconds of a free runner).
      - name: Plan this run (pending, catch-up, batch, order)
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob, os
          pending = len(glob.glob("data/_pending/*.json"))
          try:
              cfg = json.load(open("config.json"))
          except Exception:
              cfg = {}
          cu = cfg.get("catch_up", {})
          enabled = bool(cu.get("enabled", True))
          try:
              st = json.load(open("data/catch_up.json"))
          except Exception:
              st = {"active": False}
          active = enabled and bool(st.get("active"))
          batch = int(cu.get("batch_size", 1000)) if active else int(cfg.get("analyze_batch_size", 50))
          order = "newest_first" if active else "oldest_first"
          schedule = os.environ.get("SCHEDULE", "")
          event = os.environ.get("EVENT", "")
          frequent = (schedule == cu.get("frequent_cron", "*/30 * * * *"))
          if pending == 0:
              has_work = False
          elif event == "schedule" and frequent and not active:
              has_work = False          # the sprint cron only works during catch-up
          else:
              has_work = True

          # Night-gate: heavy Claude work runs ONLY in the owner's Israel-time night window,
          # so the SHARED Pro/Max token isn't drained during his working hours. A daytime cron
          # still fires but no-ops cheaply; the pending videos wait for tonight. Manual
          # workflow_dispatch always overrides. (improve/review are already night-scheduled.)
          nw = (cfg.get("cadence", {}) or {}).get("night_window", {}) or {}
          gated = False
          if has_work and nw.get("enabled") and event != "workflow_dispatch":
              applies = nw.get("applies_to", "all")
              if applies == "all" or (applies == "heavy_only" and active):
                  try:
                      from zoneinfo import ZoneInfo
                      import datetime as _dt
                      loc = _dt.datetime.now(ZoneInfo(nw.get("tz", "Asia/Jerusalem")))
                      sh, sm = (int(x) for x in str(nw.get("start", "23:00")).split(":"))
                      eh, em = (int(x) for x in str(nw.get("end", "07:00")).split(":"))
                      cur, s, e = loc.hour * 60 + loc.minute, sh * 60 + sm, eh * 60 + em
                      in_window = (s <= cur < e) if s < e else (cur >= s or cur < e)
                  except Exception:
                      in_window = True   # fail OPEN — never get permanently stuck off
                  if not in_window:
                      has_work, gated = False, True
          print(f"pending={pending}")
          print(f"catch_up={'true' if active else 'false'}")
          print(f"batch={batch}")
          print(f"order={order}")
          print(f"night_gated={'true' if gated else 'false'}")
          print(f"has_work={'true' if has_work else 'false'}")
          PY
          echo "Plan written to outputs (pending / catch_up / batch / order / has_work)."

      - name: Analyze pending videos (skills, tools, models, connectors, commands)
        id: claude
        if: steps.plan.outputs.has_work == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Uses your Claude Pro/Max subscription token (NO separate Anthropic API
          # billing). Generated once a year with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_REAL }}
          # Explicit tool allow-list so the run stays fully non-interactive AND can use the
          # network for Step 2c (following AI-relevant links in a video's description). This
          # MUST list every tool the stage uses — Bash/Edit/Write/Read/Glob/Grep for files +
          # git, WebFetch/WebSearch for links — otherwise it narrows the permissive default
          # and breaks git/file operations.
          claude_args: '--allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch,WebSearch,TodoWrite"'
          prompt: |
            Run the analysis stage of the YouTube Skills Tracker.
            Follow CLAUDE.md exactly — it is the authoritative spec.
            Process up to ${{ steps.plan.outputs.batch }} videos from data/_pending/.
            Processing order = ${{ steps.plan.outputs.order }}: if "newest_first", sort the
            pending records by their publishedAt field and process the NEWEST first; if
            "oldest_first", process the oldest first.
            For EACH video: run the relevance gate and the Step 2b video-quality review,
            follow any AI-relevant links in the description with WebFetch (Step 2c) and mine
            their resources, extract into every relevant section (skills/techniques vs
            tools/products are SEPARATE — keep them apart; plus models, connectors, and
            commands/tips), and capture any off-tab recurring anecdote to
            data/tab_candidates.json for dynamic-tab discovery. Then move its file from
            data/_pending to data/processed and commit AND push before moving to the next
            video. Update the run report and the cumulative total_videos_analyzed in
            data/status.json. When you reach the batch limit or data/_pending is empty, stop
            and leave any remainder for the next run.

      # Reliability (A1): record whether the analyze step succeeded so the dashboard can show
      # a red, actionable banner (usually a yearly-expired subscription token). The Claude
      # step is intentionally left ABLE to fail (no continue-on-error) so a real failure also
      # turns the whole job red and GitHub emails you — this step only adds a machine-readable
      # flag. A skipped no-op sprint run counts as healthy.
      - name: Record analyze health
        if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          HAS_WORK: ${{ steps.plan.outputs.has_work }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          p = pathlib.Path("data/status.json")
          try:
              st = json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              st = {}
          outcome = os.environ.get("OUTCOME", "")   # success|failure|skipped|cancelled|""
          now = datetime.datetime.utcnow().isoformat() + "Z"
          if outcome == "failure":
              st["analyze_ok"] = False
              st["analyze_failed_at"] = now
              st["token_hint"] = (
                  "The analyze run FAILED. The most common cause is an expired Claude "
                  "subscription token — renew it (run `claude setup-token` once a year) and "
                  "update the CLAUDE_CODE_OAUTH_TOKEN_REAL GitHub secret. Otherwise check the "
                  "Actions log for the failing step."
              )
          elif outcome in ("success", "skipped", ""):
              st["analyze_ok"] = True
              st["token_hint"] = ""
              if outcome == "success":
                  st["last_analyze_ok_at"] = now
          # 'cancelled' leaves the previous flag as-is
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(st, indent=2, ensure_ascii=False), encoding="utf-8")
          print("analyze_ok:", st.get("analyze_ok"), "outcome:", outcome)
          PY

      # Auto-return: in "auto" mode, once the backlog is drained, turn catch-up off so the
      # */30 sprint cron goes back to no-op and the 3h cadence resumes. Manual forced_on /
      # forced_off (set via the MCP tool) are respected.
      - name: Update catch-up state
        if: always()
        run: |
          python3 - <<'PY'
          import json, glob, pathlib, datetime
          p = pathlib.Path("data/catch_up.json")
          try:
              st = json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              st = {"mode": "auto", "active": False}
          pending = len(glob.glob("data/_pending/*.json"))
          mode = st.get("mode", "auto")
          if mode == "forced_off":
              st["active"] = False
          elif mode == "forced_on":
              st["active"] = True
          elif pending == 0:
              st["active"] = False          # auto: backlog cleared -> return to normal
          st["last_pending"] = pending
          st["updated_at"] = datetime.datetime.utcnow().isoformat() + "Z"
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(st, indent=2), encoding="utf-8")
          print("catch_up active:", st.get("active"), "pending:", pending)
          PY

      # Safety net: commit anything Claude changed but did not push (partial work) plus the
      # updated catch-up state.
      - name: Commit any remaining changes
        if: always()
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data skills other-skills docs 2>/dev/null || true
          git commit -m "analyze: safety commit $(date -u +%Y-%m-%dT%H:%MZ)" \
            || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
