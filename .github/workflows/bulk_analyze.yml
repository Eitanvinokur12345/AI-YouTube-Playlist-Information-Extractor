name: Bulk analyze (free, Gemini)

# The FREE "bulk lane". Drains the data/_pending backlog (and any future big burst) using
# Gemini Flash's FREE tier instead of the Claude Pro subscription token — ZERO Claude usage.
# Claude stays the premium lane (improve/review + optional incremental). Stdlib only, no pip.
# Uses the Gemini key the review feature already uses (EXTERNAL_REVIEW_API_KEY secret).
on:
  schedule:
    - cron: "30 */2 * * *"     # every 2h (more frequent = faster link coverage), offset 30m to avoid git contention
  workflow_dispatch:
    inputs:
      limit:
        description: "Max videos to analyze this run"
        default: "200"

concurrency:
  group: skills-tracker-bulk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Data guard FIRST — restore any data file that collapsed in a prior run
        run: python -m src.data_guard || true

      - name: Bulk-analyze pending videos with the free engine pool
        env:
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_REAL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
        run: python -m src.bulk_analyze --limit "${{ github.event.inputs.limit || '200' }}" --sleep 3.0

      - name: Resolve REAL links (website/github/codespaces) + verify them — the ACCESS protocol
        if: always()
        env:
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_REAL }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
        run: |
          python -m src.resolve_links --limit 300 --sleep 0.8 || true
          python -m src.build_memory --limit 250 --sleep 0.4 || true

      - name: Single-tab guarantee + rebuild knowledge graph + mirror models (free, mechanical)
        if: always()
        run: |
          python -m src.cross_tab_check || true
          python -m src.recategorize || true
          python -m src.source_bundles || true
          python -m src.build_models || true
          python -m src.build_graph || true
          python -m src.export_graphml || true
          python -m src.build_pipeline_graph || true

      - name: Self-improvement protocols — trend watch, maintenance sweep, live status (free)
        if: always()
        run: |
          python -m src.token_startup || true
          python -m src.trend_watch || true
          python -m src.maintenance_check || true
          python -m src.backup_system || true
          python -m src.token_tips || true
          python -m src.priorities || true
          python -m src.goals_check || true
          python -m src.pipeline_scout || true
          python -m src.pipeline_status || true
          python -m src.improve_log || true

      - name: Synthesize the AI-news digest (the system's own summary, free engine pool)
        if: always()
        env:
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_REAL }}
        run: python -m src.news_digest || true

      - name: Progress readout (transcripts X/Y, library totals) -> data/health.json
        if: always()
        run: python -m src.health || true

      - name: Effectiveness scoreboard (per-lane quality/quantity/.../access) -> data/effectiveness.json
        if: always()
        run: python -m src.effectiveness || true

      - name: Public hub index (machine-readable manifest for external systems) -> data/hub.json
        if: always()
        run: python -m src.build_hub_index || true

      - name: Dev doc — refresh technical reference (workflows/modules/schemas) from the real repo
        if: always()
        run: python -m src.build_dev_doc || true

      - name: Reference self-check (50 questions, MECHANICAL — no Claude) -> data/self_check.json
        if: always()
        run: python -m src.self_check || true

      - name: Safety ratings for connectors/skills (safe/caution/risky) -> data/safety.json
        if: always()
        env:                                  # EXCAVA embeds the task to recall tools by meaning
          # ── FULL engine pool for the BEAT (fix 2026-07-06): the beat runs LAST in this job, after
          #    analysis/links/news drained the Gemini free-tier quota → rooms hit 429 and, with only
          #    Gemini present, had NO fallback = 0 conversations across 33 beats. Giving the beat the
          #    same pool as engine_selftest lets rooms fall through to Groq/Cerebras (separate, fast
          #    quota) so agents actually speak. This is the "make one vertical real" fix. ──
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_REAL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: |
          python -m src.safety_check || true
          python -m src.security_scan || true
          python -m src.excava || true

      - name: Data guard LAST — restore from snapshot if any file collapsed during this run
        if: always()
        run: python -m src.data_guard || true

      - name: Commit results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Eitanvinokur12345/AI-YouTube-Playlist-Information-Extractor.git"
          git add data skills other-skills backups 2>/dev/null || true
          git commit -m "bulk-analyze (free pool): $(date -u +%Y-%m-%dT%H:%MZ)" \
            || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
