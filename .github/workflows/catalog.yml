name: Refresh video library
on:
  schedule:
    - cron: "45 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main, "rebuild/video-knowledge-core-20261119"]
    paths:
      - "src/video_catalog.py"
      - "docs/video-library.js"
concurrency:
  group: video-catalog-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify core and preservation before generating views
        run: python -m unittest discover -s tests -v
      - name: Build views over existing data
        run: |
          python -m src.video_catalog
          python -m src.build_hub_api
      - name: Save generated views to the same branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/video_catalog.json docs/hub_api.json docs/hub_api_packages.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "catalog: refresh video stages and public library API"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
