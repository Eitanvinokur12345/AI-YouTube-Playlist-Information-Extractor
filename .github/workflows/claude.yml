name: Claude (interactive, @claude)

# Lets you drive changes from INSIDE GitHub — no local session needed.
# Mention "@claude ..." in an issue, an issue comment, or a PR review comment
# (from a browser or your phone) and Claude reads it in the cloud, makes the
# change, and opens / updates a pull request you can review and merge.
#
# Cost: uses your Claude Pro/Max SUBSCRIPTION token (CLAUDE_CODE_OAUTH_TOKEN_REAL),
# the same one the analyze/improve/review stages use — NO new paid billing.
# Safety: the action only acts for users with write access to the repo, so random
# visitors commenting "@claude" cannot run up your usage.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Don't pile up runs if you edit a comment quickly; let an in-flight one finish.
concurrency:
  group: skills-tracker-claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

# Only spin up a runner when "@claude" actually appears in the relevant text.
jobs:
  claude:
    # SECURITY (public repo): require BOTH "@claude" AND a trusted author_association
    # (OWNER/MEMBER/COLLABORATOR). claude-code-action also rejects non-collaborators internally,
    # but this guard stops a stranger's comment from even starting a runner — defense in depth.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write         # create branches / commit changes
      pull-requests: write    # open and update PRs
      issues: write           # reply on issues
      id-token: write         # OIDC token required by claude-code-action
      actions: read           # let Claude read CI results if it needs to
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Same subscription token as the other stages (no extra cost).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_REAL }}
          # Give Claude the file + git + web tools it needs to actually make changes.
          claude_args: '--allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch,WebSearch,TodoWrite"'
