name: Video knowledge core checks
on:
  pull_request:
  push:
    branches: ["rebuild/video-knowledge-core-20261119"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: node --check docs/dashboard.js
      - run: node --check docs/video-library.js
      - run: node --check docs/sw.js
      - name: Validate active workflow structure
        run: |
          pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path(".github/workflows").glob("*.yml"):
              workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
              for job in workflow.get("jobs", {}).values():
                  for step in job.get("steps", []):
                      assert "run" in step or "uses" in step, (str(path), step.get("name"))
          PY
      - name: Build current-data catalog for browser smoke tests
        run: python -m src.video_catalog
      - name: Install headless browser test dependency
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check core tabs and video filters without EXCAVA
        run: python tests/browser_smoke.py
