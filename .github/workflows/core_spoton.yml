name: CORE SPOT-ON (discovery + deep-retrieve + verify)

# EXCAVA v2 M1.C: the owner's #1 priority — deepest, freshest, most accurate core.
#   - discovery agent (M1.C2): HOURLY sweep of GitHub-new/active, HN, Product Hunt + tier-1
#     social -> the gated intake queue. Same-day freshness.
#   - discover-promote (M1.C2, deterministic): HOURLY, right after discovery — turns the raw
#     intake queue into owner-visible discovered_elements.json (Sources tab). Already runs via
#     src/excava.py's beat (called from bulk_analyze.yml, ~every 2-3h); added here too so this
#     hourly, currently-healthy lane gives it a second, more frequent path that doesn't depend
#     on the separate excava_beat.yml lane, which guardrails' G-P has flagged as intermittently
#     stale (away fire 110, 2026-08-02).
#   - deep-retrieve (M1.C1): every 2h, a batch of thin elements gets rebuilt from FULL
#     sources (real transcripts + README + homepage) and LLM-fused on the free pool.
#   - github-meta-enrich (M1.C1, deterministic, non-brain): HOURLY, the GitHub REST API's own
#     description/topics fill github-linked stubs directly — no LLM, no local drain dependency,
#     so it makes progress even when deep-retrieve's brain step is skipped/off.
#   - verify-elements (M1.2/C3): every 6h, a rolling batch is checked to the >=2-source +
#     live-test standard; conflicts reconciled+noted; dead only after 2 consecutive failures.
#
# COST: $0 — public endpoints, the repo's free-pool engine keys, CI minutes.
on:
  schedule:
    - cron: "5 * * * *"          # hourly — discovery every run; heavier steps gated below
  workflow_dispatch:

concurrency:
  group: skills-tracker-core-spoton
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discovery agent (hourly, everywhere)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.discovery_agent --limit-per-source 20

      - name: Discover-promote (hourly, after discovery)
        if: ${{ !cancelled() }}
        run: python -m src.discover_promote

      - name: Deep retrieve (every 2nd hour)
        if: ${{ !cancelled() }}
        env:
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ $((10#$(date -u +%H) % 2)) -eq 0 ]; then
            python -m src.deep_retrieve --limit 60
          else
            echo "odd hour - skipped (runs every 2nd hour)"
          fi

      - name: GitHub-metadata enrich (hourly, deterministic — no LLM/brain)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.github_meta_enrich --limit 60

      - name: Verify elements (every 6th hour)
        if: ${{ !cancelled() }}
        run: |
          if [ $((10#$(date -u +%H) % 6)) -eq 0 ]; then
            python -m src.verify_elements --limit 300
          else
            echo "not a verify hour - skipped (every 6h)"
          fi

      - name: Relate + prewarm (every 6th hour, after verify)
        if: ${{ !cancelled() }}
        run: |
          if [ $((10#$(date -u +%H) % 6)) -eq 0 ]; then
            python -m src.relate && python -m src.prewarm --top 80
          else
            echo "not a relate/prewarm hour"
          fi

      - name: Rebuild the unified index
        if: ${{ !cancelled() }}
        run: python -m src.element_model

      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "core-spoton: $(date -u +%Y-%m-%dT%H:%MZ) — discovery/deep-retrieve/verify + index" \
            || echo "nothing to commit"
          # 2026-07-27 (away fire 29): same fix as mine.yml/fire 28 — an hourly lane, second most
          # likely (after excava_beat) to collide with another lane in the same push window. Abort
          # a failed rebase and retry as a merge; if that also conflicts, auto-resolve only the
          # known-stateless data/data_guard.json in our favor. Any other conflict is left
          # unresolved on purpose (degrades to today's push-skipped, never worse).
          if ! git pull --rebase --autostash origin main; then
            echo "rebase failed — aborting and retrying as a merge"
            git rebase --abort 2>/dev/null || true
            if ! git pull --no-rebase --no-edit origin main; then
              echo "merge also conflicted — auto-resolving known-stateless files in our favor (data_guard.json + fully-regenerated readouts)"
              git checkout --ours -- data/data_guard.json data/health.json data/effectiveness.json data/hub.json data/self_check.json data/safety.json data/guardrails_status.json 2>/dev/null || true
              git add data/data_guard.json data/health.json data/effectiveness.json data/hub.json data/self_check.json data/safety.json data/guardrails_status.json 2>/dev/null || true
              git commit --no-edit || echo "unresolved conflict outside the known-stateless set — leaving for manual/next-run recovery"
            fi
          fi
          git push || echo "push skipped"
