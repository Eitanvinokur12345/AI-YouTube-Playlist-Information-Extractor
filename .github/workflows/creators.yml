name: Creators department (daily)

# Phase 3 of EXCAVA_PROGRAM.md. DISCOVERY (gap radar over real data) -> drafts -> independent
# self-test -> publish INTO the project, always labeled "Created by EXCAVA" (owner rule /
# guardrail G-12); an independent test re-runs before any creation's first use. Publishing
# beyond the project stays behind the G3>=70 outward gate.
#
# COST: $0 — data-grounded drafting, no LLM tokens, no paid services.
on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

concurrency:
  group: skills-tracker-creators
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discovery -> draft -> self-test -> publish (labeled)
        run: python -m src.excava_creators --max-new 6

      - name: Commit creations
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/created_by_excava.json data/creators_discovery.json
          git commit -m "creators: $(date -u +%Y-%m-%dT%H:%MZ) — labeled drafts from discovery gaps" \
            || echo "nothing to commit"
          # On a rebase conflict (another lane pushed in the same window), abort a
          # failed rebase and retry as a merge; auto-resolve only the known-stateless
          # data/data_guard.json in our favor. Any other conflict is left unresolved on purpose
          # (degrades to today's push-skipped, never worse).
          if ! git pull --rebase --autostash origin main; then
            echo "rebase failed — aborting and retrying as a merge"
            git rebase --abort 2>/dev/null || true
            if ! git pull --no-rebase --no-edit origin main; then
              echo "merge also conflicted — auto-resolving known-stateless data_guard.json in our favor"
              git checkout --ours -- data/data_guard.json 2>/dev/null || true
              git add data/data_guard.json 2>/dev/null || true
              git checkout --ours -- data/brain_graph.json 2>/dev/null || true
              git add data/brain_graph.json 2>/dev/null || true
              python -m src.merge_json_array_conflict data/designs.json designs slug 2>/dev/null && git add data/designs.json 2>/dev/null || true
              git commit --no-edit || echo "unresolved conflict outside data_guard.json — leaving for manual/next-run recovery"
            fi
          fi
          git push || echo "push skipped"
