name: EXCAVA beat (agentic heartbeat)

# The OS beat as its OWN workflow, decoupled from the heavy bulk_analyze job.
# WHY: the beat used to run LAST inside bulk_analyze, after analysis/links/news had already
# drained the Gemini free-tier quota — so rooms hit 429 with no engine and produced 0 turns
# across 33 beats. Here the beat runs alone with the FULL working engine pool (groq/sambanova/
# mistral/gh-models proven answering in selftest run 28817002526), so agents actually converse.
# COST: free — only the free engine pool; no Claude tokens, no paid services.
on:
  workflow_dispatch:            # trigger on demand to PROVE rooms advance
  schedule:
    - cron: "*/10 * * * *"      # every 10 min (owner). Free (public repo). GH cron is best-effort,
                                # so timing is approximate; rate-aware backpressure guards the engines.

concurrency:
  group: skills-tracker-excava-beat
  cancel-in-progress: false

permissions:
  contents: write               # commit the chat transcripts + status back to the repo
  models: read
  issues: write                 # external-action pilot: agent files a repo issue AFTER owner approval
                                # (models:read = POWER win 2026-07-11 — free gh-models via the Actions token)

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 340          # ~5.5h: the job stays alive beating every 10 min (see run step)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the beat (rooms converse + self-improve) with the working engine pool
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # free gh-models fallback (models:read above)
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_REAL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # DURABLE HEARTBEAT (2026-07-07): GitHub throttles the */10 cron to every few HOURS, so one
          # short run can't be "every 10 min". Fix — this job RUNS ~5.3 HOURS, beating every 10 min
          # internally + committing each cycle. The cron fires every 2-4h and each run lasts 5.3h
          # (concurrency queues, never overlaps) => near-CONTINUOUS real 10-min beats, free, no owner.
          END=$((SECONDS + 19000))
          n=0
          while [ "$SECONDS" -lt "$END" ]; do
            n=$((n+1)); echo "── beat cycle $n ($(date -u +%H:%MZ)) ──"
            # 2026-07-27 (fire 27): src.excava's own ROOM_ADVANCE_BUDGET_S=240 only checks the
            # clock BETWEEN rooms, not inside a single chat.advance()/engine call — so one call that
            # doesn't return (an outage that doesn't cleanly error, a retry storm, anything the
            # in-process budget can't see) can wedge the whole beat with zero commits for the rest
            # of the run's 340-min timeout. Confirmed live: run 30250614002 sat >50 min past its last
            # "excava-beat #45" commit with no new one. `timeout` is an outer guard the inner code
            # can never defeat — worst case this cycle is skipped and the NEXT one (10 min later)
            # gets a clean shot instead of the whole 5.3h run being lost to one bad cycle.
            # fire 42: `timeout 280 ...` alone only sends SIGTERM at 280s — if the child (or a
            # grandchild it spawns) doesn't exit on SIGTERM, timeout just waits, and the whole
            # ~5.3h job can wedge on cycle 1 with zero commits (confirmed live: run 30321198496
            # started 03:55, its OWN first cycle didn't reach the git-sync step until 05:58 — a
            # ~2h stall on what should be a <5min cycle). `-k 30` forces a SIGKILL 30s after the
            # SIGTERM if the process is still alive, so a cycle can never exceed ~310s again.
            timeout -k 30 280 python -m src.excava || echo "excava beat cycle timed out or errored — continuing to next cycle"
            timeout -k 15 60 python -m src.pulse || true     # refresh the one-glance program pulse (data/excava/pulse.json)
            git add data
            git commit -m "excava-beat #$n: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
            # 2026-07-27 (away fire 29): same fix as mine.yml/fire 28 — this is the highest-cadence
            # lane of all (a beat every ~10 min), so a same-window collision with another lane is
            # the MOST likely place to hit the "rebase conflicts, push-skipped swallows it, job
            # still reads success" bug. On rebase failure, abort (restores the local commit — no
            # loss) and retry as a merge; if that also conflicts, auto-resolve only the known-
            # stateless data/data_guard.json in our favor and finish the merge. Any other
            # conflicting file is left unresolved on purpose (degrades to today's push-skipped).
            #
            # 2026-08-01 (away fire 88): fire 29's "leave it unresolved" left the merge IN
            # PROGRESS (MERGE_HEAD + conflict-marker text on disk in the unresolved files). The
            # NEXT cycle's `git add data` (line below, next iteration) then staged those literal
            # `<<<<<<<`/`=======`/`>>>>>>>` markers as the "resolved" content and `git commit`
            # happily committed them — silently baking git conflict markers into
            # data/excava/state.json, rooms.json, bus.json, etc. every cycle from then on. Every
            # cycle after that crashed `python -m src.excava` (JSON parse error on its own
            # corrupted state) with zero real work done, for the rest of the ~5.3h run — confirmed
            # live in run 30677675426 (started 01:26Z): only ONE beat commit (#7) ever reached
            # origin/main; local cycles 8-35+ all ran, all Tracebacked, none synced. Never reached
            # origin only because push then always failed too (divergent/garbage history) — but
            # the whole rest of every run was wasted. Fix: if the merge still can't be completed
            # after the known-stateless resolve, ABORT it — restores the working tree to this
            # cycle's own clean local commit (no markers, still valid JSON) so the next cycle's
            # `python -m src.excava` runs against real data again. This cycle's changes stay
            # local-only/unsynced (same net effect as before — "push skipped" either way) but
            # nothing gets corrupted and every subsequent cycle keeps doing real work instead of
            # crashing.
            if ! git pull --rebase --autostash origin main; then
              echo "rebase failed — aborting and retrying as a merge"
              git rebase --abort 2>/dev/null || true
              if ! git pull --no-rebase --no-edit origin main; then
                echo "merge also conflicted — auto-resolving known-stateless files in our favor (data_guard.json + fully-regenerated readouts)"
                # 2026-08-01 (away fire 89): widened this whitelist per fire 88's flagged
                # follow-up. Added the 7 excava/*.json files that are, like the original 7,
                # wholesale read-modify-written every beat cycle (state.json/bus.json/
                # rooms.json/leases.json/pulse.json/recent_events.json/backlog.json — verified
                # each is loaded then json.dumps()'d back out whole, not appended-to, so "ours"
                # loses nothing that the next cycle doesn't immediately regenerate anyway).
                # Deliberately NOT widened: the .jsonl append-logs (history.jsonl,
                # improvements.jsonl, syscalls.jsonl, staleness_events.jsonl,
                # supervisor_longterm.jsonl) and the chats/, traces/, agent_memory/,
                # artifacts/, handoffs/ trees — those genuinely accumulate irreplaceable rows
                # per cycle/agent, so a blind "ours" on a conflicting one would silently drop
                # the other lane's real entries. No union-merge exists for them yet; left
                # unresolved on purpose so an unhandled conflict there still degrades to the
                # old "abort the merge, this cycle stays local/unsynced" behavior rather than
                # ever losing data. See AWAY_LOG.md fire 89 for the reasoning.
                git checkout --ours -- data/data_guard.json data/health.json data/effectiveness.json data/hub.json data/self_check.json data/safety.json data/guardrails_status.json data/excava/state.json data/excava/bus.json data/excava/rooms.json data/excava/leases.json data/excava/pulse.json data/excava/recent_events.json data/excava/backlog.json 2>/dev/null || true
                git add data/data_guard.json data/health.json data/effectiveness.json data/hub.json data/self_check.json data/safety.json data/guardrails_status.json data/excava/state.json data/excava/bus.json data/excava/rooms.json data/excava/leases.json data/excava/pulse.json data/excava/recent_events.json data/excava/backlog.json 2>/dev/null || true
                if ! git commit --no-edit; then
                  echo "unresolved conflict outside the known-stateless set — aborting the merge so the working tree stays clean/parseable for the next cycle (this cycle's changes stay local-only, unsynced, same as before)"
                  git merge --abort 2>/dev/null || git reset --hard HEAD 2>/dev/null || true
                fi
              fi
            fi
            git push || echo "push skipped"
            [ "$SECONDS" -lt "$END" ] && sleep 300 || true
          done
          echo "beat run complete: $n cycles over ~5.3h"
