name: Fetch playlist

# Deterministic fetch stage: pulls the playlist, grabs transcripts (English then
# Hebrew, then description/title), classifies news, and writes data/_pending/*.json
# + status.json. Runs every 48 hours (cron is UTC). Also runnable manually.
on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

# Never run two fetches at once; queue instead of overlapping.
concurrency:
  group: skills-tracker-fetch
  cancel-in-progress: false

permissions:
  contents: write   # commit data/ back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch playlist, transcripts, news classification
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.fetch

      - name: Commit pending records + news + status
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "fetch: $(date -u +%Y-%m-%dT%H:%MZ) — new pending records + news/status" \
            || echo "nothing to commit"
          # Push, rebasing if the remote moved in the meantime. On a rebase conflict
          # (another lane pushed in the same window), abort and retry as a merge;
          # auto-resolve only the known-stateless data/data_guard.json in our favor. Any
          # other conflict is left unresolved on purpose (degrades to today's push-skipped,
          # never worse).
          if ! git pull --rebase --autostash origin main; then
            echo "rebase failed — aborting and retrying as a merge"
            git rebase --abort 2>/dev/null || true
            if ! git pull --no-rebase --no-edit origin main; then
              echo "merge also conflicted — auto-resolving known-stateless data_guard.json in our favor"
              git checkout --ours -- data/data_guard.json 2>/dev/null || true
              git add data/data_guard.json 2>/dev/null || true
              git commit --no-edit || echo "unresolved conflict outside data_guard.json — leaving for manual/next-run recovery"
            fi
          fi
          git push || echo "push skipped"
