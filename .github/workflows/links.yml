name: Links + memory (fast lane)

# The #1 priority (real links on every item) was filling too slowly behind the heavy bulk pipeline.
# This is a LIGHT, frequent lane: just resolve links (LLM-recall + free web search + your keys),
# build the semantic-memory embeddings, guard the data, commit. Free. ZERO Claude tokens.
on:
  schedule:
    - cron: "15 * * * *"      # every hour
  workflow_dispatch:
    inputs:
      limit:
        description: "Max items to resolve this run"
        default: "800"

concurrency:
  group: skills-tracker-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Data guard FIRST
        run: python -m src.data_guard || true

      - name: Resolve real links + build semantic memory
        env:
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_REAL }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          python -m src.resource_check || true
          python -m src.resolve_links --limit "${{ github.event.inputs.limit || '800' }}" --sleep 0.5 || true
          python -m src.build_memory --limit 150 --sleep 0.3 || true
          python -m src.memory_brain census || true   # refresh the one-brain census (M1 unify-memory)
          python -m src.excava_engines --brains || true   # refresh the brain-family roster (M2)

      - name: Source bundles + status + guard
        if: always()
        run: |
          python -m src.source_bundles || true
          python -m src.goals_check || true
          python -m src.coverage_log || true
          python -m src.pipeline_status || true
          python -m src.data_guard || true

      - name: Commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Eitanvinokur12345/AI-YouTube-Playlist-Information-Extractor.git"
          git add data backups 2>/dev/null || true
          git commit -m "links+memory (fast lane): $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          # 2026-07-27 (away fire 29): same fix as mine.yml/fire 28 — an hourly "fast lane", one of
          # the most likely to land in the same push window as excava_beat/core_spoton. Abort a
          # failed rebase and retry as a merge; if that also conflicts, auto-resolve only the
          # known-stateless data/data_guard.json in our favor. Any other conflict is left
          # unresolved on purpose (degrades to today's push-skipped, never worse).
          if ! git pull --rebase --autostash origin main; then
            echo "rebase failed — aborting and retrying as a merge"
            git rebase --abort 2>/dev/null || true
            if ! git pull --no-rebase --no-edit origin main; then
              echo "merge also conflicted — auto-resolving known-stateless data_guard.json in our favor"
              git checkout --ours -- data/data_guard.json 2>/dev/null || true
              git add data/data_guard.json 2>/dev/null || true
              git commit --no-edit || echo "unresolved conflict outside data_guard.json — leaving for manual/next-run recovery"
            fi
          fi
          git push || echo "push skipped"
