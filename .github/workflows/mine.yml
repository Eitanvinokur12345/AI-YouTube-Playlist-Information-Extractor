name: Mine feeds (external → skills/tools/MCP)

# A SEPARATE acquisition system (NOT the self-improvement deep pass): turns the 80+ external
# web/research/community feeds (collected by news.py) into catalogued skills / tools / MCP
# connectors, on its OWN daily schedule, using the FREE engine pool — ZERO Claude-Pro tokens.
on:
  schedule:
    - cron: "0 10 * * *"      # daily 10:00 UTC — independent of analyze/improve/review
  workflow_dispatch:
    inputs:
      limit:
        description: "Max news entries to mine this run"
        default: "60"

concurrency:
  group: skills-tracker-mine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mine the external feeds into skills/tools/connectors (free engine pool)
        env:
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_REAL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.mine_feeds --limit "${{ github.event.inputs.limit || '60' }}" --sleep 3.0

      - name: Resolve "comment / link below" resources via the free engine pool (no commenting)
        env:
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_REAL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.resolve_comment_gated --limit 40 --sleep 3.0 || true

      - name: Keep derived data consistent (dedup, models, graph, readouts) — free, mechanical
        if: always()
        run: |
          python -m src.mine_competitors || true
          python -m src.collect_designs || true
          python -m src.warm_shots || true
          python -m src.build_recipes || true
          python -m src.cross_tab_check || true
          python -m src.build_models || true
          python -m src.build_graph || true
          python -m src.health || true
          python -m src.effectiveness || true
          python -m src.build_hub_index || true

      - name: Data guard — restore from snapshot if any data file collapsed
        if: always()
        run: python -m src.data_guard || true

      - name: Commit results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Eitanvinokur12345/AI-YouTube-Playlist-Information-Extractor.git"
          git add data skills other-skills 2>/dev/null || true
          git commit -m "mine-feeds (external → skills/tools/MCP): $(date -u +%Y-%m-%dT%H:%MZ)" \
            || echo "nothing to commit"
          # 2026-07-27 (away fire 28): confirmed live via the 2026-07-26 GH Actions job log that
          # this exact "rebase || true; push || echo skipped" pattern silently DISCARDED a full
          # day's real mining (+5 skills, +31 tools, +3 connectors, run 30199649757): the rebase
          # conflicted on data/data_guard.json (both sides touch its "generated_at" line — it's a
          # fully-regenerated, stateless health snapshot, so any concurrent lane rewriting it can
          # collide), left HEAD detached, and "push skipped" reported the step (and whole job) as
          # "success" while the local commit died with the ephemeral runner. This is the same
          # failure CLASS fire 25 found in core_spoton.yml (a real success-labeled job silently
          # discarding real work) via a different mechanism (rebase conflict, not octal
          # arithmetic). Fix, verified against a real bare git remote (not just read, actually
          # reproduced + fixed in a throwaway repo before landing here): on rebase failure, abort
          # it (restores the branch + local commit — no loss) and retry as a plain merge; if THAT
          # also conflicts, auto-resolve ONLY data/data_guard.json in our favor (safe — it carries
          # no unique history) and finish the merge commit. Any OTHER conflicting file is left
          # unresolved on purpose, so the step degrades to today's existing "push skipped" — never
          # worse, just not silently better either.
          if ! git pull --rebase --autostash origin main; then
            echo "rebase failed — aborting and retrying as a merge"
            git rebase --abort 2>/dev/null || true
            if ! git pull --no-rebase --no-edit origin main; then
              echo "merge also conflicted — auto-resolving known-stateless data_guard.json in our favor"
              git checkout --ours -- data/data_guard.json 2>/dev/null || true
              git add data/data_guard.json 2>/dev/null || true
              git commit --no-edit || echo "unresolved conflict outside data_guard.json — leaving for manual/next-run recovery"
            fi
          fi
          git push || echo "push skipped"
