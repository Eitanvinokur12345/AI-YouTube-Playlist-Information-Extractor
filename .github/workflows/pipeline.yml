name: Skills Tracker Pipeline

# Runs every 48 hours (cron is UTC). Adjust as needed. Also runnable manually.
on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write   # allow committing data/ and skills/ back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 1: deterministic fetch (playlist + transcripts + news classification).
      - name: Fetch playlist and transcripts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.fetch

      # Step 2: analysis via Claude Code (uses your Pro/Max subscription token,
      # so NO separate Anthropic API billing). Generated with `claude setup-token`.
      - name: Analyze and build tabs
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the analysis stage of the YouTube Skills Tracker on the files
            produced in data/_pending. Follow PIPELINE.md exactly. Update all five
            tabs (skills, models ranking, improvement merges, tips/commands, news),
            write SKILL.md files, and commit the results.

      - name: Commit results
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data skills docs || true
          git commit -m "pipeline run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push || echo "push skipped"
