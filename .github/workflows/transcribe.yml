name: Transcribe (cloud, Supadata — unattended)

# UNATTENDED, PC-FREE transcript recovery — this is what makes Excavatortron self-run WITHOUT
# Eitan's computer being on (the project's whole point: no intervention).
#
# Why this is the only thing that works from the cloud: YouTube hard-blocks GitHub's datacenter IP
# for BOTH the caption API and yt-dlp audio (verified in Actions logs: it returned 0). Supadata
# fetches the caption on THEIR infrastructure (mode=native, existing captions = ~1 credit), so the
# IP block doesn't apply. Free tier ~100/month -> --limit 3/day ≈ 90/month, which keeps up with new
# playlist videos and slowly drains the backlog with ZERO human involvement. Graceful-skip if
# SUPADATA_API_KEY is absent. Stdlib only, no pip — the run is ~40s.
#
# The residential backfill (src/backfill_transcripts.py via sync/fetch-runner.ps1 OR during a
# Claude session) is an OPTIONAL accelerator that recovers transcripts far faster from a home IP —
# but it is no longer REQUIRED; this workflow is the autonomous baseline.
on:
  schedule:
    - cron: "0 4 * * *"        # once/day, 04:00 UTC (~07:00 Israel)
  workflow_dispatch:
    inputs:
      limit:
        description: "How many videos to fetch via Supadata this run (mind the ~100/month free tier)"
        default: "3"

concurrency:
  group: skills-tracker-transcribe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch transcripts via Supadata (their infra → bypasses YouTube's datacenter-IP block)
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python -m src.supadata_fetch --limit "${{ github.event.inputs.limit || '3' }}" || true

      - name: Commit transcripts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Eitanvinokur12345/AI-YouTube-Playlist-Information-Extractor.git"
          git add data/_pending data/processed 2>/dev/null || true
          git commit -m "transcribe (supadata): $(date -u +%Y-%m-%dT%H:%MZ)" \
            || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
