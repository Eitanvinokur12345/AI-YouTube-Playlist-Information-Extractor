name: Transcribe (cloud Whisper)

# Cloud Whisper ASR — runs faster-whisper on the GitHub runner, so it needs ZERO disk and ZERO
# CPU on your PC (you're low on local disk). It downloads each video's audio on the runner
# (deleted right after), transcribes with the light 'tiny' model, and re-queues the transcript
# to data/_pending for the night-gated analyze stage to re-extract.
#
# Free: public-repo Actions. CAVEAT: YouTube sometimes throttles audio downloads from
# datacenter IPs — runs are best-effort; whatever fails is retried next run, and the local
# runner (sync/fetch-runner.ps1) can still pick up the rest from your residential IP if needed.
on:
  schedule:
    - cron: "0 */2 * * *"      # every 2h — drive the transcript backlog down fast (free Actions)
  workflow_dispatch:
    inputs:
      limit:
        description: "How many videos to transcribe this run"
        default: "30"

concurrency:
  group: skills-tracker-transcribe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper yt-dlp youtube-transcript-api

      - name: Step 1 - Caption backfill (fast, text-only, works from cloud IPs for many videos)
        run: |
          python -m src.backfill_transcripts --limit 400 --sleep 0.4

      - name: Step 2 - Whisper for remaining caption-less videos (CPU ASR, gaps mode)
        run: |
          python -m src.transcribe_local \
            --limit "${{ github.event.inputs.limit || '60' }}" \
            --mode gaps --model tiny --cpu-threads 2

      - name: Commit transcripts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Eitanvinokur12345/AI-YouTube-Playlist-Information-Extractor.git"
          git add data/_pending data/processed 2>/dev/null || true
          git commit -m "transcribe (cloud): $(date -u +%Y-%m-%dT%H:%MZ)" \
            || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
