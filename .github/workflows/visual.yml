name: Visual protocol (watch each video's screen → designs/formats/URLs)

# The DEDICATED visual lane: a separate pass that WATCHES each video's pixels (not the transcript) and
# extracts designs, reusable UI formats and on-screen URLs. Then collect_designs rebuilds the
# designs-ONLY tab (designs from AI websites + the videos), full-page-captured in the dashboard.
# Runs on the FREE Gemini video quota (all keys round-robined) — ZERO Claude-Pro tokens.
on:
  schedule:
    - cron: "30 2 * * *"      # 02:30 UTC
    - cron: "30 14 * * *"     # 14:30 UTC — two passes/day chip through the backlog
  workflow_dispatch:
    inputs:
      limit:
        description: "Max videos to watch this run"
        default: "20"

concurrency:
  group: skills-tracker-visual
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Watch each video's screen → designs / formats / on-screen URLs (free Gemini pool)
        env:
          EXTERNAL_REVIEW_API_KEY: ${{ secrets.EXTERNAL_REVIEW_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: python -m src.visual_extract --limit "${{ github.event.inputs.limit || '20' }}" --sleep 2.0 || true

      - name: Rebuild the designs-ONLY tab (AI websites + shown-in-video, deduped)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.collect_designs || true

      - name: Data guard — restore from snapshot if any data file collapsed
        if: always()
        run: python -m src.data_guard || true

      - name: Commit results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "skills-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Eitanvinokur12345/AI-YouTube-Playlist-Information-Extractor.git"
          git add data 2>/dev/null || true
          git commit -m "visual-protocol + designs: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          # 2026-07-27 (away fire 31): same fix as mine.yml/core_spoton.yml (fire 28/29) — twice
          # daily, and this lane's old `git push || true` was the most silent of all (no message
          # even on skip). Abort a failed rebase and retry as a merge; auto-resolve only the
          # known-stateless data/data_guard.json in our favor. Any other conflict is left
          # unresolved on purpose (degrades to today's push-skipped, never worse).
          if ! git pull --rebase --autostash origin main; then
            echo "rebase failed — aborting and retrying as a merge"
            git rebase --abort 2>/dev/null || true
            if ! git pull --no-rebase --no-edit origin main; then
              echo "merge also conflicted — auto-resolving known-stateless files in our favor (data_guard.json + fully-regenerated readouts)"
              git checkout --ours -- data/data_guard.json data/health.json data/effectiveness.json data/hub.json data/self_check.json data/safety.json data/guardrails_status.json 2>/dev/null || true
              git add data/data_guard.json data/health.json data/effectiveness.json data/hub.json data/self_check.json data/safety.json data/guardrails_status.json 2>/dev/null || true
              git commit --no-edit || echo "unresolved conflict outside the known-stateless set — leaving for manual/next-run recovery"
            fi
          fi
          git push || echo "push skipped"
