<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Skills Tracker — Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e8e8ea; }
    header { padding: 20px 28px; background: #161922; border-bottom: 1px solid #262a36; }
    h1 { margin: 0; font-size: 20px; }
    .meta { color: #9aa0ad; font-size: 13px; margin-top: 4px; }
    nav { display: flex; gap: 8px; padding: 12px 28px; background: #12141b; flex-wrap: wrap; }
    nav button { background: #1d2230; color: #cfd3dc; border: 1px solid #2a3040; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    nav button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    main { padding: 24px 28px; }
    .empty { color: #9aa0ad; }
  </style>
</head>
<body>
  <header>
    <h1>AI Skills Tracker</h1>
    <div class="meta" id="meta">Loading…</div>
  </header>
  <nav id="tabs">
    <button data-tab="skills" class="active">Skills Library</button>
    <button data-tab="models">Models Ranking</button>
    <button data-tab="merges">Improvement Log</button>
    <button data-tab="tips">Tips &amp; Commands</button>
    <button data-tab="news">News Feed</button>
  </nav>
  <main id="view"><p class="empty">Dashboard renders from the JSON files in /data once the first pipeline run completes.</p></main>
  <script src="dashboard.js"></script>
</body>
</html>
